[project]
name = "outworld-backend"
version = "2.0.0"
requires-python = ">=3.15"
dependencies = [
  "fastapi>=0.165.0",
  "uvicorn>=0.54.0",
  "pydantic>=2.14.4",
  "httpx>=0.28.1",
  "pysweph>=2.10.3.6",
  "sympy>=1.14.0",
  "z3-solver>=5.4.1.0",
  "tzdata>=2026.6",
  "pyyaml>=6.0.2",
]

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.17.4"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["."]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RET", "S", "PT", "RUF"]
# B008: FastAPI's Depends()/Field() in defaults is the documented pattern.
ignore = ["E501", "S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["BLE001", "S110", "S112", "S311"]
# Fixed SQL fragments only; every value is a bound parameter.
"tools/knowledge.py" = ["S608"]
# Column names are pydantic field names, never user input.
"app/api/*.py" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".pytest-cache"
addopts = ["--basetemp=.pytest-tmp"]
